name: Zip Working Copies

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Create ZIP of Working copies
      run: |
        if [ -d "Working copies" ]; then
          mkdir -p output
          zip -r output/working-copies.zip "Working copies"
        else
          echo "Folder 'Working copies' not found"
          exit 1
        fi

    - name: Upload ZIP to Release
      uses: softprops/action-gh-release@v1
      with:
        files: output/working-copies.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
